<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Hær Simulering</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
    }
    canvas {
      border: 2px solid #444;
      background: #1e1e1e;
    }
  </style>
</head>
<body>

<canvas id="simCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

class Soldier {
  constructor(x, y, team) {
    this.x = x;
    this.y = y;
    this.team = team; // 'blue' eller 'red'
    this.radius = 4;
    this.speed = 1.5;
    this.hp = 100;
    this.attack = 1.5;
    this.color = team === 'blue' ? '#3b82f6' : '#ef4444';
  }

  // Find nærmeste fjende og bevæg dig mod ham
  update(enemies) {
    let nearest = null;
    let minDist = Infinity;

    for (let enemy of enemies) {
      if (enemy.hp <= 0) continue;
      const dx = enemy.x - this.x;
      const dy = enemy.y - this.y;
      const distSq = dx * dx + dy * dy;
      if (distSq < minDist) {
        minDist = distSq;
        nearest = enemy;
      }
    }

    if (nearest) {
      const dx = nearest.x - this.x;
      const dy = nearest.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Hvis de rammer hinanden (kollision) -> Kæmp!
      if (dist < this.radius + nearest.radius) {
        nearest.hp -= this.attack;
      } else {
        // Rul mod fjenden
        this.x += (dx / dist) * this.speed;
        this.y += (dy / dist) * this.speed;
      }
    }
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.closePath();
  }
}

// Opret hærer
const armyBlue = [];
const armyRed = [];

// Blå hær til venstre
for (let i = 0; i < 150; i++) {
  armyBlue.push(new Soldier(50 + Math.random() * 100, 100 + Math.random() * 400, 'blue'));
}

// Rød hær til højre
for (let i = 0; i < 150; i++) {
  armyRed.push(new Soldier(650 + Math.random() * 100, 100 + Math.random() * 400, 'red'));
}

// Gameloop
function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Filtrer døde soldater fra
  const activeBlue = armyBlue.filter(s => s.hp > 0);
  const activeRed = armyRed.filter(s => s.hp > 0);

  // Opdater og tegn blå
  activeBlue.forEach(s => {
    s.update(activeRed);
    s.draw();
  });

  // Opdater og tegn rød
  activeRed.forEach(s => {
    s.update(activeBlue);
    s.draw();
  });

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
